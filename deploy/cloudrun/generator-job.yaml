# Cloud Run job that writes the coming days' prompts. Cloud Scheduler runs it at 23:30 Montreal (Eastern) time
# (see deploy/setup.sh). Same image as the API, different command. Applied with `gcloud run jobs replace`.
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: mcgill-krillion-generate
  labels:
    app: mcgill-krillion
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    spec:
      parallelism: 1
      taskCount: 1
      template:
        spec:
          serviceAccountName: mcgill-krillion-generator@${PROJECT_ID}.iam.gserviceaccount.com
          # The generator makes up to 3 attempts of up to 420 s each (1260 s) per day, and a run can fill two days
          # (tomorrow is backfilled if it has no set), so leave headroom past 2 x 1260 s.
          # maxRetries reruns the whole job once more if it still exits non-zero; days already stored are skipped.
          maxRetries: 1
          timeoutSeconds: 3000
          containers:
            - image: ${IMAGE}
              command: ["python", "-m", "rarest_blue.entrypoints.cli.generate"]
              resources:
                limits:
                  cpu: "1"
                  memory: 512Mi
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: mcgill-krillion-database-url
                      key: latest
                - name: OPENROUTER_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: mcgill-krillion-openrouter-key
                      key: latest
